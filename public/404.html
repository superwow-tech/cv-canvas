<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting...</title>
    <script>
      // Store the requested path so the SPA can restore it after GitHub Pages serves index.html.
      sessionStorage.setItem("redirect", window.location.pathname + window.location.search + window.location.hash);
      window.location.replace("/sarunas/");
    </script>
  </head>
  <body>
    <p>Redirecting to the app...</p>
  </body>
</html>
